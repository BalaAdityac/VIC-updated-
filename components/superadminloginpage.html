<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Access - VIC</title>
  
  <!-- Import Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Embedded CSS so you don't need a separate file -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fc; /* Matching the light background */
      color: #1c234a; /* Matching the dark blue text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page-wrapper {
      width: 100%;
      max-width: 460px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Logo Area */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 40px;
      height: auto;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1c234a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Main White Card */
    .login-card {
      background-color: #ffffff;
      width: 100%;
      border-radius: 24px;
      padding: 40px 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1c234a;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 35px;
    }

    /* Form Elements */
    .login-form {
      text-align: left;
    }

    .input-group {
      margin-bottom: 22px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1c234a;
      text-transform: uppercase; /* Matches your reference */
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #9ca3af;
      font-size: 1.1rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background-color: #f9fafb;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      color: #1c234a;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #1c234a;
      background-color: #ffffff;
    }

    .input-wrapper input::placeholder {
      color: #9ca3af;
    }

    /* Button */
    .submit-btn {
      width: 100%;
      background-color: #21254a;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #141730;
    }

    /* Bottom Link */
    .card-footer {
      margin-top: 30px;
    }

    .footer-link {
      font-size: 0.9rem;
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-link:hover {
      color: #1c234a;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Header / Logo -->
    <header class="brand-header">
      <!-- Make sure your logo image is named logo.png and is in the same folder -->
      <img src="C:\Users\sukru\Downloads\VIC-updated-\public\logo.png" alt="VIC Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-name">Visionary Interns Club</h1>
    </header>

    <!-- Login Card -->
    <main class="login-card">
      <div class="card-header">
        <h2 class="card-title">Super Admin Access</h2>
        <p class="card-subtitle">Sign in to view platform analytics and the administrative audit trail.</p>
      </div>

      <form class="login-form">
        <!-- Email Input -->
        <div class="input-group">
          <label for="email">Admin Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="superadmin@vic.dev" required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">
          Authenticate <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Connection Settings Link -->
      <div class="card-footer">
        <a href="#" class="footer-link">Connection Settings</a>
      </div>
    </main>
  </div>

</body>
</html>
